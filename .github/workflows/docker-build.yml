name: Docker - build images & compose smoke test

on:
  push:
    branches: [main, rayen]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            file: backend/Dockerfile
          - service: gateway
            context: gateway
            file: gateway/Dockerfile
          - service: frontend
            context: frontend
            file: frontend/Dockerfile
          - service: trainer
            context: .
            file: docker/train.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: phytora-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-smoke-test:
    name: docker compose up (mock model) + end-to-end checks (API, MLOps services)
    runs-on: ubuntu-latest
    needs: build
    env:
      MOCK: "1"   # model weights live in DVC, not in Git: CI serves well-formed mock predictions
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: API, gateway and web app (scripts/smoke_test.sh)
        run: scripts/smoke_test.sh || (docker compose logs backend gateway; exit 1)
      - name: MLOps services (MLflow, Prefect, Prometheus, Grafana)
        run: |
          wait_for() { for i in $(seq 1 60); do curl -fsS "$1" > /dev/null && return 0; sleep 3; done; docker compose logs; return 1; }
          wait_for http://localhost:5001
          wait_for http://localhost:4200/api/health
          wait_for http://localhost:9090/-/ready
          wait_for http://localhost:3001/api/health
          # Prometheus scrapes the API and loaded the alert rules
          sleep 20
          curl -fsS 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22phytora-api%22%7D' | tee /dev/stderr | grep -q '"1"'
          curl -fsS http://localhost:9090/api/v1/rules | grep -q DataDriftDetected
          # Grafana provisioned the dashboard
          curl -fsS -u admin:admin 'http://localhost:3001/api/search?query=PHYTORA' | grep -q phytora-monitoring
          # the trainer registered the Prefect deployments
          for i in $(seq 1 40); do
            curl -fsS -X POST http://localhost:4200/api/deployments/filter -H 'Content-Type: application/json' -d '{}' | grep -q training-pipeline && break; sleep 5
          done
          curl -fsS -X POST http://localhost:4200/api/deployments/filter -H 'Content-Type: application/json' -d '{}' | grep -o '"name":"[a-z-]*"' | sort -u
      - if: always()
        run: docker compose down -v
