name: Docker - build images & compose smoke test

on:
  push:
    branches: [main, rayen]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            file: backend/Dockerfile
          - service: gateway
            context: gateway
            file: gateway/Dockerfile
          - service: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: phytora-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-smoke-test:
    name: docker compose up (mock model) + end-to-end checks
    runs-on: ubuntu-latest
    needs: build
    env:
      MOCK: "1"   # model weights live in DVC, not in Git: CI serves well-formed mock predictions
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for the services
        run: |
          for url in http://localhost:8000/health http://localhost:5000/health http://localhost:3000; do
            for i in $(seq 1 60); do curl -fsS "$url" > /dev/null && break; sleep 3; done
            curl -fsS "$url" > /dev/null || (docker compose logs; exit 1)
          done
      - name: FastAPI contract
        run: |
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"model_loaded":true'
          curl -fsS http://localhost:8000/model/metadata > /dev/null
          curl -fsS -F "file=@frontend/public/examples/feuille.jpg;type=image/jpeg" http://localhost:8000/predict | tee /dev/stderr | grep -q '"class_id"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -F 'file=@README.md;type=text/plain' http://localhost:8000/predict)" = "400"
          curl -fsS http://localhost:5001 > /dev/null
      - if: always()
        run: docker compose down -v
