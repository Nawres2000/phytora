# Whole platform in one command:  docker compose up --build
#   web app  http://localhost:3000   | gateway  http://localhost:5000/health
#   FastAPI  http://localhost:8000/docs (Swagger) | MLflow http://localhost:5001
# Model files come from DVC (`dvc pull`) and are mounted read-only into the API.
name: phytora

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "*"
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MODEL_DIR: ${MODEL_DIR:-/app/models/legacy}
      ONNX_VARIANT: ${ONNX_VARIANT:-}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.60}
      MIN_MARGIN: ${MIN_MARGIN:-0.10}
      MOCK: ${MOCK:-0}
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8000:8000"

  gateway:
    build: ./gateway
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/phytora
      MODEL_API_URL: http://backend:8000
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change-me-with-at-least-32-characters!!}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_MODEL_API_URL: http://localhost:8000
        NEXT_PUBLIC_MLFLOW_URL: http://localhost:5001
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  mlflow-data:
